<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>彩虹宠物物语 · Rainbow Pet Saga</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="彩虹宠物">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0912">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0b0912; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #game {
    display: block;
    touch-action: none;
    -webkit-touch-callout: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #101a2c; color: #ffe9a8; font-size: 15px; letter-spacing: 1px;
    z-index: 10; transition: opacity .35s ease;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot">彩虹正在升起…</div>
  <script src="art.js"></script>
  <script src="game.js"></script>
  <script>
    window.addEventListener('load', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('hide');
    });
    window.addEventListener('error', function (e) {
      if (window.__started) return;
      var boot = document.getElementById('boot');
      if (boot) { boot.classList.remove('hide'); boot.textContent = '加载出错：' + (e.message || '未知错误'); }
    });
  </script>
</body>
</html>
