name: PetKingdom
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

targets:
  PetKingdom:
    type: application
    platform: iOS
    sources:
      - path: PetKingdom
    info:
      path: PetKingdom/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.petkingdom
        PRODUCT_NAME: PetKingdom
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO

schemes:
  PetKingdom:
    build:
      targets:
        PetKingdom: all
    run:
      config: Debug
