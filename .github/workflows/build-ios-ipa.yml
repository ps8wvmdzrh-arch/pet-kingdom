name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inline web assets
        run: node tools/inline.js

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          test -d PetKingdom.xcodeproj
          xcodebuild -version
          xcodebuild -list -project PetKingdom.xcodeproj

      - name: Build (no code signing)
        run: |
          cd ios
          xcodebuild \
            -project PetKingdom.xcodeproj \
            -scheme PetKingdom \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PetKingdom.app Payload/
          zip -qr PetKingdom-unsigned.ipa Payload
          ls -lh PetKingdom-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetKingdom-unsigned-ipa
          path: PetKingdom-unsigned.ipa
          if-no-files-found: error
